# OmniDocBench v1.6 stratified-sample gate evaluation, FRESH-REPRO predictions leg.
# Twin of v16-sample81.yaml; scores the sample pages re-generated by the current
# adapter build into predictions/mineru_sample81_repro.
#
# The ground-truth manifest is a deterministic derivative (130 pages) of
# data/OmniDocBench.json; see v16-sample81.yaml for the regeneration command and
# docs/benchmarks/mineru-sample81-gate-2026-08-01.md for the gate evidence.
#
# This is a TEMPLATE: score.ps1 replaces <REPO_ROOT> with the absolute
# omnidocbench-amd-windows checkout path at runtime.
end2end_eval:
  metrics:
    text_block:      { metric: [Edit_dist] }
    display_formula: { metric: [Edit_dist] }
    table:           { metric: [TEDS, Edit_dist], teds_workers: 16 }
    reading_order:   { metric: [Edit_dist] }
  dataset:
    dataset_name: end2end_dataset
    ground_truth: { data_path: <REPO_ROOT>/tmp_sample81_gt.json }
    prediction:   { data_path: <REPO_ROOT>/predictions/mineru_sample81_repro }
    match_method: quick_match
    match_workers: 24
